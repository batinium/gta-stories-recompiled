name: Mod problem
description: A GTA III / Vice City / San Andreas mod does not load, looks wrong or crashes in the mod loader.
labels: ["mods", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach or link game files, ISOs or save files with copyrighted content.** Link the mod's own download page
        instead of re-uploading it. What converts and what doesn't: [docs/LCS.md](https://github.com/batinium/gta-stories-recompiled/blob/main/docs/LCS.md) "Mods".
  - type: input
    id: link
    attributes:
      label: Mod link
      description: The page the mod comes from (not a file you re-host).
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Liberty City Stories
        - Vice City Stories
        - GTA Stories (both cities)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "e.g. 0.3.0"
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: Mod type (car, bike, weapon, handling, sound...), the slot you replaced, what you see, what you expected. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Logs
      description: The launcher's Help > Make a report zip, or the mod loader lines from the game's log.
      render: text
