# Instruction patches (address -> replacement word), applied by the recompiler: the code that misbehaved with a time step
# under CTimer's 0.5 floor (1/100 s), which independent timing lowers to 0.2 (src/game/lcs_framerate.cpp: 240 fps). Each
# is the twin of a game/vcs/overrides.toml patch unless said otherwise; steps >= 0.5 (>= 1.0 for the cameras) run
# exactly as before. 0x3C013A83 = `lui $at, 0x3A83` (0.001 in place of 0.5).
#
# FUN_001D5830 (ped animation movement, VCS FUN_001F1D38) turns the frame's root displacement into the ped's move
# velocity (+0x4D8 / +0x4DC): `if (ms_fTimeStep < 0.5) v *= 0.5; else v *= 1 / ms_fTimeStep;` - the branch dead on the
# PS2 and wrong below the floor (peds at a quarter of their speed). The 0.5 ($f3, 0x1D597C) is the compare's and the
# multiply's only; 0.001 sends every real step down the 1 / step path.
[[patches]]
address = "0x001D5978"
value = "0x3C013A83"

# FUN_001D6F30 (LCS only; no VCS patch): a ped's stuck test counts frames (+0x348) against `50 / (max(step, 0.5) * 4)`
# and `50 / (max(step, 0.5) * 2)` - 1/4 s and 1/2 s of frames; below the floor too few frames, so it gave up sooner.
# Each 0.5 is the max.s operand only ($f2 at 0x1D938C, $f0 at 0x1D9484 / 0x1D99D8, rewritten before any other read).
[[patches]]
address = "0x001D9388"
value = "0x3C013A83"
[[patches]]
address = "0x001D9480"
value = "0x3C013A83"
[[patches]]
address = "0x001D99D4"
value = "0x3C013A83"

# CBike::ProcessControl FUN_00157990 (vtable 0x3AC1B0 slot 4; VCS FUN_00337208): the lean from the sideways change of
# speed, `dv / (max(step, 0.5) * 0.008)`; $f1 = 0.5 only the max.s operand (0x15BBF8), reloaded at 0x15BC24.
[[patches]]
address = "0x0015BBE0"
value = "0x3C013A83"

# Vehicles in water (VCS FUN_00138B68 / FUN_00336CB8): the buoyancy impulse's z over `mass * max(step, 0.5) * 0.008`
# is the share under water (drag pow(1 - share * 0.05, step), the sinking thresholds). Cars FUN_00127458 load the 0.5
# on two paths ($f2, max.s at 0x127520, reloaded 0x12752C), bikes FUN_001574E8 once ($f1, max.s 0x15759C, reloaded
# 0x1575A8).
[[patches]]
address = "0x001274E4"
value = "0x3C013A83"
[[patches]]
address = "0x00127508"
value = "0x3C013A83"
[[patches]]
address = "0x00157584"
value = "0x3C013A83"

# Boats (VCS FUN_0019FDA0's rudder force): the ProcessControl at 0x17ECA0 (vtable 0x3ACEC0, CBike's slot) scales a
# force by `max(step, 0.5)` (0x180D68) where the rest is times the step; $f1 = 0.5 only the max.s operand (reloaded
# at 0x180D7C).
[[patches]]
address = "0x00180D4C"
value = "0x3C013A83"

# The follow cameras (VCS FUN_0029DAB0 / FUN_0029FAF0): the automatic turn toward behind the player is made a speed by
# `(new beta - beta) / max(step, 1.0)` - on foot FUN_00281E90 (0x282E28), behind a vehicle FUN_00283EB8 (0x284A3C):
# step times too slow above 50 fps. The 1.0 registers ($f2, $f3) are read again, so the max.s moves onto the two
# hazard nops after it, with 0.001 in $f5 (not read before the next call in either function, nor by FUN_00361820):
# `lui $at, 0x3A83; mtc1 $at, $f5; max.s $fD, $fS, $f5`. $at is written again before any read.
[[patches]]
address = "0x00282E28"
value = "0x3C013A83"
[[patches]]
address = "0x00282E2C"
value = "0x44812800"
[[patches]]
